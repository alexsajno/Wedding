<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שחר ואלכס – שמרו את התאריך</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=David+Libre:wght@400;500;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#FBF8F2; --ink:#1F1B2E; --indigo:#2D3A8C; --purple:#7A4FA3;
  --gold:#A97C2B; --gold-light:#D2AE5C; --gold-dark:#7E5A1A; --lilac:#C9B6E4;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh; color:var(--ink);
  font-family:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  background:
    radial-gradient(circle at 0% 0%, rgba(122,79,163,.30), transparent 36%),
    radial-gradient(circle at 100% 0%, rgba(45,58,140,.26), transparent 34%),
    radial-gradient(circle at 0% 100%, rgba(45,58,140,.26), transparent 38%),
    radial-gradient(circle at 100% 100%, rgba(122,79,163,.30), transparent 36%),
    var(--ivory);
  display:flex; justify-content:center; padding:28px 16px 44px;
}
main{width:100%; max-width:420px}
.arch{
  background:rgba(251,248,242,.92); border:1.5px solid var(--gold-light);
  border-radius:999px 999px 18px 18px;
  padding:72px 28px 32px; text-align:center;
}
.kicker{margin:0 0 12px; font-family:"David Libre",Georgia,serif; font-size:1.2rem; font-weight:500; color:var(--purple)}
h1{
  margin:0; font-family:"David Libre",Georgia,serif; font-weight:700;
  font-size:3.4rem; line-height:1.08;
  color:var(--gold);
  background:linear-gradient(180deg,var(--gold-light) 0%,var(--gold) 45%,var(--gold-dark) 100%);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent;
}
.rule{width:56px; height:1.5px; background:var(--purple); margin:22px auto; opacity:.7}
.date{margin:0; font-family:"David Libre",Georgia,serif; font-size:1.6rem; font-weight:500; color:var(--ink)}
.time{margin:6px 0 0; font-size:1.1rem; font-weight:600; color:var(--indigo)}
.venue{margin:16px 0 0; font-size:1.08rem; line-height:1.5}
.venue a{color:var(--indigo); font-weight:600}
.actions{margin-top:26px; display:grid; gap:12px}
.btn{
  display:block; padding:15px 18px; border-radius:12px; text-decoration:none;
  font-weight:700; font-size:1.05rem; text-align:center;
  border:1.5px solid var(--indigo);
}
.btn.primary{background:var(--indigo); color:#fff}
.btn.secondary{background:transparent; color:var(--indigo)}
.btn:hover{filter:brightness(1.1)}
.btn:focus-visible,.venue a:focus-visible{outline:3px solid var(--gold-light); outline-offset:3px}
.note{margin:16px 4px 0; font-size:.88rem; line-height:1.55; color:#54506A; text-align:center}
.card{
  display:block; width:100%; height:auto; margin-top:22px;
  border-radius:14px; border:1.5px solid var(--gold-light);
}
@media (max-width:360px){h1{font-size:2.9rem}}
</style>
</head>
<body>
<main>
  <section class="arch">
    <p class="kicker">שמרו את התאריך</p>
    <h1>שחר<br>ואלכס</h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="date">יום רביעי, 24 במרץ 2027</p>
    <p class="time">19:00</p>
    <p class="venue">אולם גרייס, ראשון לציון<br>
      <a href="https://waze.com/ul?ll=31.9885229,34.7670739&amp;navigate=yes">ניווט בוויז</a></p>

    <div class="actions">
      <a class="btn primary" href="wedding_save_the_date.ics">הוספה ביומן במכשיר</a>
      <a class="btn secondary" href="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=%D7%97%D7%AA%D7%95%D7%A0%D7%94%20%D7%A9%D7%97%D7%A8%20%D7%95%D7%90%D7%9C%D7%9B%D7%A1&amp;dates=20270324T190000/20270324T235900&amp;ctz=Asia/Jerusalem&amp;location=%D7%90%D7%95%D7%9C%D7%9D%20%D7%92%D7%A8%D7%99%D7%99%D7%A1%2C%20%D7%94%D7%90%D7%A6%D7%B4%D7%9C%209%2C%20%D7%A8%D7%90%D7%A9%D7%95%D7%9F%20%D7%9C%D7%A6%D7%99%D7%95%D7%9F" target="_blank" rel="noopener">הוספה ל־Google Calendar</a>
    </div>
    <p class="note"></p>
  </section>

  <img class="card" src="save_the_date.jpg" width="900" height="1613" alt="שחר ואלכס – Save the Date, 24.03.2027. ההזמנה תגיע בהמשך.">
</main>
</body>
</html>
